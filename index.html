<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Nobl</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="config.js"></script>
</head>
<body>

  <div class="reading-progress hidden" id="reading-progress">
    <div class="reading-progress-bar" id="reading-progress-bar"></div>
  </div>

  <!-- HOME VIEW -->
  <main id="home-view" class="view active">

    <!-- HEADER -->
    <header class="site-header">
      <h1 class="site-header-name">Noah Hupfeld</h1>
      <p class="site-header-label">Essays</p>
    </header>

    <!-- COMING SOON -->
    <div class="ideas-wrap" id="ideas-wrap"></div>

    <!-- FEED -->
    <div class="feed-wrap">
      <div class="feed" id="feed"></div>
      <div class="no-results hidden" id="no-results">
        <p>No posts found.</p>
      </div>

    </div>

  </main>

  <!-- POST VIEW -->
  <main id="post-view" class="view">
    <div class="post-wrap">
      <button class="back-btn" id="back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Back
      </button>
      <article class="post-article">
        <div class="post-meta-top" id="post-meta-top">
          <img class="post-avatar" id="post-avatar" src="" alt="" />
          <div class="post-meta-top-text">
            <span class="post-author" id="post-author"></span>
            <span class="post-date-read">
              <span id="post-date"></span>
              <span class="dot">·</span>
              <span id="post-read-time"></span> min read
            </span>
          </div>
        </div>
        <h1 class="post-title" id="post-title"></h1>
        <p class="post-subtitle" id="post-subtitle"></p>
        <div class="post-cover-wrap" id="post-cover-wrap">
          <img class="post-cover" id="post-cover" src="" alt="" />
        </div>
        <div class="post-body" id="post-body"></div>
      </article>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="footer-links">
      <a href="mailto:noah.hupfeld@gmail.com">Email</a>
      <span class="footer-dot">·</span>
      <a href="https://instagram.com/noah.hup" target="_blank" rel="noopener">Instagram</a>
    </div>
    <p class="footer-copyright" id="footer-copyright"></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
